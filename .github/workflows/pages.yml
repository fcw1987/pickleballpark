name: Deploy verified Pages artifact

on:
  push:
    branches: [feature/reference-depth-review]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character SHA currently at main with successful Quality checks
        required: true
        type: string
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  select-artifact:
    name: Select verified main artifact
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.selection.outputs.commit_sha }}
      quality_run_id: ${{ steps.selection.outputs.quality_run_id }}
      artifact_id: ${{ steps.selection.outputs.artifact_id }}
      artifact_digest: ${{ steps.selection.outputs.artifact_digest }}
    steps:
      - name: Check out trusted main selection code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Select current-main push run with all required jobs and immutable artifact
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/select-pages-artifact.mjs

  deploy:
    name: Deploy exact verified artifact
    needs: select-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out exact trusted validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-artifact.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download the selected verified Pages artifact by immutable ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.select-artifact.outputs.quality_run_id }}
          artifact-ids: ${{ needs.select-artifact.outputs.artifact_id }}
          digest-mismatch: error
          path: verified-artifact
      - name: Validate archive safety and exact commit-derived runtime bytes
        env:
          COMMIT_SHA: ${{ needs.select-artifact.outputs.commit_sha }}
        run: |
          node tools/extract-pages-artifact.mjs verified-artifact/artifact.tar verified-contents
          node tools/verify-deployment-artifact.mjs verified-contents "$COMMIT_SHA" --require-clean
      - name: Re-upload the unchanged verified tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: verified-artifact/artifact.tar
          if-no-files-found: error
          retention-days: 7
      - name: Reconfirm current main, required jobs and original artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.select-artifact.outputs.commit_sha }}
          QUALITY_RUN_ID: ${{ needs.select-artifact.outputs.quality_run_id }}
          PAGES_ARTIFACT_ID: ${{ needs.select-artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_DIGEST: ${{ needs.select-artifact.outputs.artifact_digest }}
        run: node tools/select-pages-artifact.mjs --confirm
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Explicit owner-requested feature-branch test deployment. Main publication
  # continues to use the verified Quality artifact selected above.
  feature-preview:
    name: Verify and deploy requested feature preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/reference-depth-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.preview-deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out exact feature checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run static, unit and generated-asset checks
        run: |
          npm run check
          npm run check:generated
      - name: Install package-test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Build and verify runtime-only feature artifact
        run: |
          npm run build:site -- --require-clean
          npm run verify:package
          node tools/verify-deployment-artifact.mjs dist "$GITHUB_SHA" --require-clean
      - name: Upload verified runtime artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: dist/
          retention-days: 7
      - name: Verify official Pages archive against exact feature checkpoint
        run: |
          node tools/extract-pages-artifact.mjs "$RUNNER_TEMP/artifact.tar" verified-preview
          node tools/verify-deployment-artifact.mjs verified-preview "$GITHUB_SHA" --require-clean
      - name: Deploy requested feature checkpoint to existing Pages site
        id: preview-deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
