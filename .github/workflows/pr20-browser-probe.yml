name: PR20 focused timeline precision probe

on:
  push:
    branches: [ci/pr20-browser-probe]
  workflow_dispatch:

# This isolated probe collects Linux evidence. It neither replaces the required
# Quality workflow nor builds, publishes, or deploys an application artifact.
permissions:
  contents: read

concurrency:
  group: pr20-browser-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-probe:
    name: Focused Linux ${{ matrix.browser }} timeline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            config: playwright.config.mjs
          - browser: webkit
            config: playwright.webkit.config.mjs
    steps:
      - name: Check out exact probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Use official Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          # Change only the download hostname. Preserve suites, signed-by,
          # keys and the normal apt signature checks used by Playwright.
          for filename in ['/etc/apt/sources.list', '/etc/apt/sources.list.d/ubuntu.sources', '/etc/apt/apt-mirrors.txt']:
              path = Path(filename)
              if path.is_file():
                  original = path.read_text()
                  updated = original.replace('://azure.archive.ubuntu.com/', '://archive.ubuntu.com/')
                  if updated != original:
                      path.write_text(updated)
                      print(f'Using official Ubuntu archive in {filename}')
          PYTHON
      - name: Install focused diagnostic browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Record probe identity
        run: |
          mkdir -p release-results/pr20-browser-probe
          git rev-parse HEAD | tee release-results/pr20-browser-probe/source-commit.txt
          git diff 28f4d0c1e7390892f861b26774be4cc5a2740ac4 HEAD -- . ':!tests/pixel-game-review.spec.mjs' ':!.github/workflows/pr20-browser-probe.yml' > release-results/pr20-browser-probe/non-timeline-source.diff
          test ! -s release-results/pr20-browser-probe/non-timeline-source.diff
          node --version | tee release-results/pr20-browser-probe/node-version.txt
          npx playwright --version | tee release-results/pr20-browser-probe/playwright-version.txt
      - name: Run exactly one timeline precision case
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: release-results/pr20-browser-probe/timeline.json
        run: |
          set -o pipefail
          PLAYWRIGHT_JSON_OUTPUT_NAME=release-results/pr20-browser-probe/timeline-catalog.json npx playwright test tests/pixel-game-review.spec.mjs --config=${{ matrix.config }} --project=${{ matrix.browser }} --grep='normal-motion playback' --list --reporter=json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('release-results/pr20-browser-probe/timeline-catalog.json','utf8'));
          const count=suites=>suites.reduce((n,s)=>n+(s.specs||[]).reduce((m,p)=>m+p.tests.length,0)+count(s.suites||[]),0);
          const total=count(report.suites);if(total!==1)throw Error(`Expected exactly 1 timeline case; found ${total}`);console.log(`Exact timeline catalog: ${total}`);
          NODE
          npx playwright test tests/pixel-game-review.spec.mjs --config=${{ matrix.config }} --project=${{ matrix.browser }} --grep='normal-motion playback' --workers=1 --retries=0 --trace=retain-on-failure --output=release-results/pr20-browser-probe/timeline-results --reporter=line,json 2>&1 | tee release-results/pr20-browser-probe/timeline.log
      - name: Retain timeline report, log and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr20-linux-${{ matrix.browser }}-timeline-${{ github.sha }}
          path: |
            release-results/pr20-browser-probe/
          if-no-files-found: warn
          retention-days: 7
