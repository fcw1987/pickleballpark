name: PR20 focused browser diagnostic

on:
  push:
    branches: [ci/pr20-browser-probe]
  workflow_dispatch:

# This isolated probe collects Linux evidence. It neither replaces the required
# Quality workflow nor builds, publishes, or deploys an application artifact.
permissions:
  contents: read

concurrency:
  group: pr20-browser-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-probe:
    name: Focused Linux ${{ matrix.browser }} candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            config: playwright.config.mjs
          - browser: webkit
            config: playwright.webkit.config.mjs
    steps:
      - name: Check out exact probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Use official Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          # Change only the download hostname. Preserve suites, signed-by,
          # keys and the normal apt signature checks used by Playwright.
          for filename in ['/etc/apt/sources.list', '/etc/apt/sources.list.d/ubuntu.sources', '/etc/apt/apt-mirrors.txt']:
              path = Path(filename)
              if path.is_file():
                  original = path.read_text()
                  updated = original.replace('://azure.archive.ubuntu.com/', '://archive.ubuntu.com/')
                  if updated != original:
                      path.write_text(updated)
                      print(f'Using official Ubuntu archive in {filename}')
          PYTHON
      - name: Install focused diagnostic browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Record probe identity
        run: |
          mkdir -p release-results/pr20-browser-probe
          git rev-parse HEAD | tee release-results/pr20-browser-probe/source-commit.txt
          git diff b45d021c596158b119f78d11e166b020cf6f3d56 HEAD -- . ':!tests/pr20-browser-probe.spec.mjs' ':!.github/workflows/pr20-browser-probe.yml' > release-results/pr20-browser-probe/non-probe-source.diff
          node --version | tee release-results/pr20-browser-probe/node-version.txt
          npx playwright --version | tee release-results/pr20-browser-probe/playwright-version.txt
      - name: Run focused actual RGBA and context diagnostic
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: release-results/pr20-browser-probe/collector.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: release-results/pr20-browser-probe/collector-html
        run: |
          set -o pipefail
          npx playwright test tests/pr20-browser-probe.spec.mjs --config=${{ matrix.config }} --project=${{ matrix.browser }} --workers=1 --retries=0 --trace=on --output=release-results/pr20-browser-probe/collector-results --reporter=line,json,html 2>&1 | tee release-results/pr20-browser-probe/collector.log
      - name: Run exactly eleven affected existing cases
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: release-results/pr20-browser-probe/affected.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: release-results/pr20-browser-probe/affected-html
        run: |
          set -o pipefail
          focused=(tests/rebrand.spec.mjs tests/visual-world.spec.mjs tests/second-render.spec.mjs tests/pixel-game-review.spec.mjs)
          selection='full brand|all Plays keep complete actors|reference world has original alpha artwork|directional artwork and solid athlete meshes|normal-motion playback'
          PLAYWRIGHT_JSON_OUTPUT_NAME=release-results/pr20-browser-probe/affected-catalog.json npx playwright test "${focused[@]}" --config=${{ matrix.config }} --project=${{ matrix.browser }} --grep="$selection" --list --reporter=json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('release-results/pr20-browser-probe/affected-catalog.json','utf8'));
          const count=suites=>suites.reduce((n,s)=>n+(s.specs||[]).reduce((m,p)=>m+p.tests.length,0)+count(s.suites||[]),0);
          const total=count(report.suites);if(total!==11)throw Error(`Expected exactly 11 focused cases; found ${total}`);console.log(`Exact focused catalog: ${total}`);
          NODE
          npx playwright test "${focused[@]}" --config=${{ matrix.config }} --project=${{ matrix.browser }} --grep="$selection" --workers=1 --retries=0 --trace=on --output=release-results/pr20-browser-probe/affected-results --reporter=line,json,html 2>&1 | tee release-results/pr20-browser-probe/affected.log
      - name: Run strict original artwork contract and negative controls
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: release-results/pr20-browser-probe/art-contract.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: release-results/pr20-browser-probe/art-contract-html
        run: |
          set -o pipefail
          PLAYWRIGHT_JSON_OUTPUT_NAME=release-results/pr20-browser-probe/art-contract-catalog.json npx playwright test tests/reference-artwork-browser-contract.spec.mjs --config=${{ matrix.config }} --project=${{ matrix.browser }} --list --reporter=json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('release-results/pr20-browser-probe/art-contract-catalog.json','utf8'));
          const count=suites=>suites.reduce((n,s)=>n+(s.specs||[]).reduce((m,p)=>m+p.tests.length,0)+count(s.suites||[]),0);
          const total=count(report.suites);if(total!==1)throw Error(`Expected exactly 1 strict artwork case; found ${total}`);console.log(`Exact strict artwork catalog: ${total}`);
          NODE
          npx playwright test tests/reference-artwork-browser-contract.spec.mjs --config=${{ matrix.config }} --project=${{ matrix.browser }} --workers=1 --retries=0 --trace=on --output=release-results/pr20-browser-probe/art-contract-results --reporter=line,json,html 2>&1 | tee release-results/pr20-browser-probe/art-contract.log
      - name: Retain native report, trace and diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr20-linux-${{ matrix.browser }}-candidate-${{ github.sha }}
          path: |
            release-results/pr20-browser-probe/
            release-results/artwork-linux-pixels-*.json
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
