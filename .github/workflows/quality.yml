name: Quality

on:
  push:
    branches: [main, branding/pickleball-park-strokes]
  pull_request:
    branches: [main, branding/pickleball-park-strokes]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run static and unit checks
        run: npm run check
      - name: Reproduce generated assets
        run: npm run check:generated

  chromium:
    name: Chromium
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium suite
        run: npm run test:browser -- --workers=1
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  webkit:
    name: WebKit
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run full WebKit suite with no failure exceptions
        run: node tools/run-webkit-ci.mjs
      - name: Retain full WebKit diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-playwright-report
          path: |
            playwright-report/
            release-results/webkit*.json
            release-results/webkit-html/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out complete source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install package-test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Build the Pages artifact
        run: npm run build:site
      - name: Verify the exact Pages artifact
        run: npm run verify:package
      - name: Upload package report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-release-results
          path: release-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages
          path: dist/
          retention-days: 7

      - name: Verify the tar produced by the official Pages action
        run: |
          mkdir verified-upload
          tar -xf "$RUNNER_TEMP/artifact.tar" -C verified-upload
          node tools/verify-deployment-artifact.mjs verified-upload "$GITHUB_SHA"

  quality-gate:
    name: Quality gate
    if: always()
    needs: [checks, chromium, webkit, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out gate script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every quality job to succeed
        env:
          QUALITY_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/check-quality-gate.mjs
