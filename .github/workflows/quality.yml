name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cone mode retains root files and docs/ brand-check prose, while
          # excluding large historical captures. Keep runtime and test inputs.
          sparse-checkout: |
            .github
            assets
            icons
            vendor
            tests
            tools
            docs/builder/examples
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run static and unit checks
        run: npm run check
      - name: Reproduce generated assets
        run: npm run check:generated

  chromium-shards:
    name: Chromium partition ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            assets
            icons
            vendor
            tests
            tools
            docs/builder/examples
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run duration-balanced whole files with one worker and no retries
        run: node tools/run-chromium-ci.mjs ${{ matrix.shard }}
      - name: Retain every Chromium partition result and plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-shard-${{ matrix.shard }}
          path: |
            release-results/chromium-ci/chromium-${{ matrix.shard }}.zip
            release-results/chromium-ci/partition-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  chromium:
    name: Chromium
    if: always()
    needs: chromium-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            assets
            icons
            vendor
            tests
            tools
            docs/builder/examples
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download every Chromium partition report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chromium-shard-*
          merge-multiple: true
          path: release-results/chromium-ci
      - name: Require every partition and the full discovered catalog exactly once
        env:
          CHROMIUM_SHARDS_RESULT: ${{ needs.chromium-shards.result }}
        run: node tools/merge-chromium-ci.mjs
      - name: Retain full Chromium diagnostic report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-playwright-report
          path: |
            release-results/chromium*.json
            release-results/chromium-html/
          if-no-files-found: ignore
          retention-days: 7

  webkit-shards:
    name: WebKit shard ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            assets
            icons
            vendor
            tests
            tools
            docs/builder/examples
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run WebKit partition with no retries or failure exceptions
        run: npx playwright test --config=playwright.webkit.config.mjs --workers=1 --retries=0 --forbid-only --shard=${{ matrix.shard }}/2 --reporter=line,blob
      - name: Retain every WebKit partition result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-shard-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 7

  webkit:
    name: WebKit
    if: always()
    needs: webkit-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            assets
            icons
            vendor
            tests
            tools
            docs/builder/examples
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download every WebKit partition report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: webkit-shard-*
          merge-multiple: true
          path: release-results/webkit-blobs
      - name: Require the full discovered catalog to pass exactly once
        env:
          WEBKIT_SHARDS_RESULT: ${{ needs.webkit-shards.result }}
        run: node tools/merge-webkit-ci.mjs
      - name: Retain full WebKit diagnostic report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-playwright-report
          path: |
            playwright-report/
            release-results/webkit*.json
            release-results/webkit-html/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install package-test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Build the Pages artifact
        run: npm run build:site -- --require-clean
      - name: Verify the exact Pages artifact
        run: npm run verify:package
      - name: Upload package report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-release-results
          path: release-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: dist/
          retention-days: 7

      - name: Verify the tar produced by the official Pages action
        run: |
          node tools/extract-pages-artifact.mjs "$RUNNER_TEMP/artifact.tar" verified-upload
          node tools/verify-deployment-artifact.mjs verified-upload "$GITHUB_SHA" --require-clean

  rally-calibration:
    name: Rally physical regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            assets
            icons
            vendor
            tests
            tools
            docs/builder/examples
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # These fixed inputs were examined in Quality 40992222059.
      # Required release acceptance does not assert unseen calibration success.
      - name: Require all 3600 examined rallies, independent physics, determinism and hosted p95
        run: >-
          node tools/rally-regression-v1.mjs --require-clean
          --output release-results/game-mode-m2/required-regression.json
          --archive release-results/game-mode-m2/required-regression.jsonl
      - name: Retain regression report and every attempted rally
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rally-regression-results
          path: |
            release-results/game-mode-m2/required-regression.json
            release-results/game-mode-m2/required-regression.jsonl
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Quality gate
    if: always()
    needs: [checks, chromium, webkit, package, rally-calibration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /tools/check-quality-gate.mjs
      - name: Require every quality job to succeed
        env:
          QUALITY_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/check-quality-gate.mjs
