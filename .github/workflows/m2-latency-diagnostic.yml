name: M2 latency diagnostic (not release acceptance)

on:
  push:
    branches: [diagnostic/m2-latency-four-cell-v1]

permissions:
  contents: read

jobs:
  diagnostic-only:
    name: Four-cell latency diagnostic - not a Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the declared diagnostic and both pinned runtime revisions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the same Node version as both retained hosted observations
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Execute exactly two declared order-balanced blocks on this host
        run: node tools/run-rally-latency-diagnostic-v1.mjs --output release-results/game-mode-m2/four-cell-diagnostic-v1
      - name: Retain every sample, result, telemetry record and declared protocol
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m2-latency-diagnostic-v1-not-acceptance
          path: release-results/game-mode-m2/four-cell-diagnostic-v1/results/
          if-no-files-found: error
          retention-days: 7
